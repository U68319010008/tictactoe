<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Game Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .floating-shape { animation: float 6s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        .game-cell { transition: 0.2s; height: 100px; border: 2px solid #E5E7EB; background: #F9FAFB; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 3rem; border-radius: 0.75rem; font-family: 'Space Grotesk'; }
        .winning-cell { background: rgba(99, 102, 241, 0.1) !important; color: #4F46E5 !important; }
    </style>
</head>
<body class="h-full bg-[#FAFAFA] text-[#171717]">
    
    <div id="landing-page" class="h-full flex flex-col items-center justify-center relative overflow-hidden px-6 text-center">
        <div class="absolute inset-0 pointer-events-none opacity-[0.03]">
            <div class="floating-shape absolute top-10 left-10 w-64 h-64 rounded-full bg-blue-600"></div>
            <div class="floating-shape absolute bottom-10 right-10 w-96 h-96 rounded-full bg-blue-600" style="animation-delay: -2s"></div>
        </div>

        <div class="relative z-10 max-w-2xl w-full">
            <div class="inline-flex items-center bg-blue-50 text-blue-600 px-4 py-1 rounded-full text-sm font-medium mb-6">พร้อมเล่นแล้ววันนี้</div>
            <h1 class="text-7xl md:text-9xl font-bold mb-6 tracking-tighter">NEXUS</h1>
            <p class="text-gray-500 mb-10 text-lg md:text-xl">สัมผัสประสบการณ์เกมแนวใหม่ที่จะเปลี่ยนมุมมองของคุณ</p>
            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <button onclick="togglePage('game')" class="bg-blue-600 text-white px-10 py-4 rounded-2xl font-bold hover:scale-105 transition shadow-xl shadow-blue-200">เริ่มเล่นเกม</button>
                <button onclick="toggleModal(true)" class="bg-white border-2 border-gray-100 px-10 py-4 rounded-2xl font-bold hover:bg-gray-50 transition">วิธีเล่น</button>
            </div>
        </div>
    </div>

    <div id="game-page" class="hidden h-full flex flex-col items-center justify-center p-6 bg-[#F8F9FA]">
        <div class="w-full max-w-sm">
            <button onclick="togglePage('landing')" class="mb-8 text-gray-400 hover:text-gray-600 flex items-center gap-2 mx-auto">
                <span>←</span> กลับหน้าหลัก
            </button>
            
            <h2 class="text-4xl font-bold text-center mb-8 font-['Space_Grotesk']">Tic Tac Toe</h2>
            
            <div class="flex gap-2 p-1 bg-gray-200/50 rounded-xl mb-6">
                <button id="mode-pvp" onclick="setMode(false)" class="flex-1 py-2 rounded-lg font-bold transition">2 Players</button>
                <button id="mode-ai" onclick="setMode(true)" class="flex-1 py-2 rounded-lg font-bold transition">vs AI</button>
            </div>

            <div class="bg-white p-4 rounded-3xl shadow-2xl border border-gray-100">
                <div id="game-board" class="grid grid-cols-3 gap-3"></div>
            </div>

            <div class="grid grid-cols-3 gap-4 mt-8 text-center bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                <div><div id="score-x" class="text-2xl font-bold text-indigo-600">0</div><div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Player X</div></div>
                <div><div id="score-draw" class="text-2xl font-bold text-gray-400">0</div><div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Draw</div></div>
                <div><div id="score-o" class="text-2xl font-bold text-pink-500">0</div><div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Player O</div></div>
            </div>
            
            <button onclick="resetGame()" class="w-full mt-6 py-4 bg-gray-900 text-white rounded-2xl font-bold hover:bg-black transition shadow-lg">รีเซ็ตเกม</button>
        </div>
    </div>

    <div id="modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-3xl max-w-xs w-full shadow-2xl text-center">
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-2xl mb-4 mx-auto font-bold">?</div>
            <h3 class="text-2xl font-bold mb-4">วิธีเล่น</h3>
            <p class="text-gray-500 text-sm mb-6 leading-relaxed">วางเครื่องหมายให้เรียงกัน 3 ช่อง <br>ถ้าวางครบ 3 ตัว ตัวที่เก่าที่สุดจะหายไป!</p>
            <button onclick="toggleModal(false)" class="w-full py-4 bg-blue-600 text-white rounded-xl font-bold shadow-lg shadow-blue-200">รับทราบ</button>
        </div>
    </div>

    <script>
        let board = Array(9).fill(''), moveOrder = [], currentPlayer = 'X', gameActive = true, isAI = false;
        const scores = { X: 0, O: 0, draw: 0 };
        const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

        const togglePage = (p) => {
            document.getElementById('landing-page').classList.toggle('hidden', p === 'game');
            document.getElementById('game-page').classList.toggle('hidden', p === 'landing');
            if(p === 'game') resetGame();
        };

        const toggleModal = (s) => document.getElementById('modal').classList.toggle('hidden', !s);

        const setMode = (ai) => {
            isAI = ai;
            document.getElementById('mode-ai').className = `flex-1 py-2 rounded-lg font-bold ${ai ? 'bg-white shadow text-indigo-600' : 'text-gray-500'}`;
            document.getElementById('mode-pvp').className = `flex-1 py-2 rounded-lg font-bold ${!ai ? 'bg-white shadow text-indigo-600' : 'text-gray-500'}`;
            resetGame();
        };

        const createBoard = () => {
            const container = document.getElementById('game-board');
            container.innerHTML = '';
            board.forEach((_, i) => {
                const cell = document.createElement('div');
                cell.className = 'game-cell';
                cell.onclick = () => handleMove(i);
                container.appendChild(cell);
            });
        };

        function handleMove(i) {
            if (board[i] || !gameActive) return;
            board[i] = currentPlayer;
            moveOrder.push(i);
            
            if (moveOrder.length > 6) {
                const oldest = moveOrder.shift();
                board[oldest] = '';
            }

            render();
            if (checkWin()) return;
            
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            if (isAI && currentPlayer === 'O') setTimeout(makeAIMove, 500);
        }

        const makeAIMove = () => {
            const empty = board.map((v, i) => v === '' ? i : null).filter(v => v !== null);
            if (empty.length) handleMove(empty[Math.floor(Math.random() * empty.length)]);
        };

        function checkWin() {
            for (let [a, b, c] of wins) {
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    scores[currentPlayer]++;
                    gameActive = false;
                    const cells = document.querySelectorAll('.game-cell');
                    [a, b, c].forEach(idx => cells[idx].classList.add('winning-cell'));
                    updateScoreUI();
                    return true;
                }
            }
            if (!board.includes('') && moveOrder.length < 6) {
                scores.draw++;
                gameActive = false;
                updateScoreUI();
                return true;
            }
            return false;
        }

        const render = () => {
            document.querySelectorAll('.game-cell').forEach((cell, i) => {
                cell.textContent = board[i];
                cell.className = `game-cell ${board[i] === 'X' ? 'text-indigo-600' : 'text-pink-500'}`;
                if(moveOrder.length === 6 && i === moveOrder[0]) cell.classList.add('opacity-30');
            });
        };

        const updateScoreUI = () => {
            document.getElementById('score-x').textContent = scores.X;
            document.getElementById('score-o').textContent = scores.O;
            document.getElementById('score-draw').textContent = scores.draw;
        };

        const resetGame = () => {
            board = Array(9).fill(''); moveOrder = []; currentPlayer = 'X'; gameActive = true;
            createBoard();
        };

        // Start
        createBoard();
        setMode(false);
    </script>
</body>
</html>
